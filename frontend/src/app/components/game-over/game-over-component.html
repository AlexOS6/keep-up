<div class="game-over-backdrop">
    <div class="game-over">
        <p>SCORE: {{ score() }}</p>
        
        @if (scoreQualifies() === null) {
            <p>Checking leaderboard...</p>
        } @else if (scoreQualifies()) {
            @if (!scoreSubmitted()) {
                <div class="initials-section">
                    <p>HIGH SCORE!</p>
                    
                    <label class="initials-label" for="player-initials">
                        ENTER INITIALS
                    </label>
                    
                    <div class="initials-entry">
                        <input 
                            id="player-initials" 
                            class="initials-input" 
                            type="text" 
                            minlength="2"
                            maxlength="3"
                            autocomplete="off"
                            [value]="playerInitials()"
                            (input)="initialsChanged.emit($any($event.target).value.toUpperCase())" 
                        />
                        
                        <button 
                            class="submit-icon" 
                            aria-label="Submit Score" 
                            [disabled]="!initialsValid() || scoreSubmitting()"
                            (click)="submit.emit()">
                            <fa-icon [icon]="faArrowRight"></fa-icon>
                        </button>
                    </div>
                    
                    @if (scoreSubmitError()) {
                        <p class="score-submit-error">
                            Unable to save score. Try again.
                        </p>
                    }
                </div>
            } @else {
                <p>SCORE SAVED</p>
            }
        }
        
        <button class="start-button" (click)="playAgain.emit()">
            Play Again
        </button>
    </div>
</div>
